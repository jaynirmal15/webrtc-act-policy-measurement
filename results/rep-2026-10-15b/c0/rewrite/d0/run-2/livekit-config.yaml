# Minimal LiveKit config for M1 Day-1 ACT gate.
# Policy: STOCK REWRITE (default). Do NOT set forward_abs_capture_time_verbatim.
# That flag exists only on PR #4812 (not merged into v1.13.7). See README § Verbatim patch.
port: 7880
bind_addresses:
  - 127.0.0.1
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  # ACT URI is already in publisher/subscriber extension lists in pkg/rtc/config.go
  # on v1.13.7 — no extra YAML needed for negotiation. SFU default = SR-gate + Rewrite.
keys:
  devkey: secret
logging:
  level: info
  pion_level: warn
room:
  auto_create: true
